services:
  - type: web
    name: mediq-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 30d
      - key: BCRYPT_SALT_ROUNDS
        value: 12
      - key: LOG_LEVEL
        value: info
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: false
      - key: SMTP_USER
        value: lschaithika@gmail.com
      - key: EMAIL_FROM_NAME
        value: Smart Healthcare Portal
      - key: EMAIL_FROM_ADDRESS
        value: lschaithika@gmail.com
      - key: UPLOAD_PROVIDER
        value: local
      - key: MAX_FILE_SIZE_MB
        value: 10
