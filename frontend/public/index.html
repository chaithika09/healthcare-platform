<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>Smart Healthcare Portal</title>
    <meta name="title" content="Smart Healthcare Portal" />
    <meta
      name="description"
      content="Smart Healthcare Record & Doctor-Patient Portal System — Manage appointments, medical records, prescriptions, and real-time consultations in one secure platform."
    />
    <meta name="keywords" content="healthcare, medical records, doctor portal, patient portal, appointments, telemedicine, EHR" />
    <meta name="author" content="Smart Healthcare Platform" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0066CC" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Smart Healthcare Portal" />
    <meta
      property="og:description"
      content="Manage appointments, medical records, prescriptions, and real-time consultations in one secure platform."
    />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Smart Healthcare Portal" />
    <meta
      name="twitter:description"
      content="Manage appointments, medical records, prescriptions, and real-time consultations in one secure platform."
    />

    <!-- Favicon & App Icons -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect to Google Fonts for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts: Inter + Poppins -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Security Headers (CSP via meta — supplement with server headers in production) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- Inline critical CSS to prevent FOUC -->
    <style>
      /* Prevent flash of unstyled content */
      html {
        background-color: #F8FAFC;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
        background-color: #F8FAFC;
        color: #0F172A;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Full-screen loading spinner shown before React mounts */
      #root-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        flex-direction: column;
        gap: 16px;
      }

      .loading-logo {
        width: 64px;
        height: 64px;
        background: linear-gradient(135deg, #0066CC, #00A86B);
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .loading-logo svg {
        width: 36px;
        height: 36px;
        fill: white;
      }

      .loading-text {
        font-family: "Poppins", sans-serif;
        font-size: 1.125rem;
        font-weight: 600;
        color: #0066CC;
        letter-spacing: -0.01em;
      }

      .loading-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #E6F0FA;
        border-top-color: #0066CC;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%       { opacity: 0.85; transform: scale(0.97); }
      }
    </style>
  </head>

  <body>
    <!-- Accessibility: skip to main content -->
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50
             focus:px-4 focus:py-2 focus:bg-primary-500 focus:text-white focus:rounded-lg"
    >
      Skip to main content
    </a>

    <!-- No-JS fallback -->
    <noscript>
      <div style="
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh; padding: 2rem; text-align: center;
        font-family: Inter, sans-serif; color: #0F172A;
      ">
        <div>
          <h1 style="font-size: 1.5rem; font-weight: 700; color: #0066CC; margin-bottom: 0.5rem;">
            Smart Healthcare Portal
          </h1>
          <p style="color: #475569;">
            JavaScript is required to run this application. Please enable JavaScript in your browser settings.
          </p>
        </div>
      </div>
    </noscript>

    <!-- React root -->
    <div id="root">
      <!-- Pre-React loading indicator -->
      <div id="root-loading" aria-label="Loading Smart Healthcare Portal" role="status">
        <div class="loading-logo" aria-hidden="true">
          <!-- Medical cross / heartbeat icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
            <path d="M9 10h6v4H9z" opacity="0.6"/>
          </svg>
        </div>
        <p class="loading-text">Smart Healthcare Portal</p>
        <div class="loading-spinner" aria-hidden="true"></div>
      </div>
    </div>
  </body>
</html>
